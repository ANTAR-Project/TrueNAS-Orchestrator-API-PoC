spring:
  application:
    name: video-service
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8082

nas:
  orchestrator:
    base-url: http://nas-orchestrator:8081

auth:
  service:
    base-url: http://auth-service:8085

service:
  auth:
    username: video-service

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5501}

management:
  endpoints:
    web:
      exposure:
        include: health, info