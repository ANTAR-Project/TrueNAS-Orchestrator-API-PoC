version: '3.8'

services:

  # ─────────────────────────────────────────
  # REDIS — Streaming URL Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: redis-antar
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - antar-network

  # ─────────────────────────────────────────
  # ZOOKEEPER — Required by Kafka
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - antar-network

  # ─────────────────────────────────────────
  # KAFKA — Event Streaming
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - antar-network

  # ─────────────────────────────────────────
  # MICROSERVICES
  # ─────────────────────────────────────────

  # nas-orchestrator
  nas-orchestrator:
    build:
      context: .
      dockerfile: nas-orchestrator/Dockerfile
    container_name: nas-orchestrator
    env_file:
      - ./nas-orchestrator/.env
    ports:
      - "8081:8081"
      - "4092:4092"
    depends_on:
      - redis
      - auth-service
    networks:
      - antar-network

  # video-service
  video-service:
    build:
      context: .
      dockerfile: video-service/Dockerfile
    container_name: video-service
    env_file:
      - ./video-service/.env
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - auth-service
    networks:
      - antar-network

  # encoding-service
  encoding-service:
    build:
      context: .
      dockerfile: encoding-service/Dockerfile
    container_name: encoding-service
    env_file:
      - ./encoding-service/.env
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - auth-service
    networks:
      - antar-network

  # streaming-service
  streaming-service:
    build:
      context: .
      dockerfile: streaming-service/Dockerfile
    container_name: streaming-service
    env_file:
      - ./streaming-service/.env
    ports:
      - "8084:8084"
    depends_on:
      - redis
      - kafka
      - nas-orchestrator
      - auth-service
    networks:
      - antar-network

  # auth-service
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    env_file:
      - ./auth-service/.env
    ports:
      - "8085:8085"
      - "4091:4091"
    depends_on:
      - redis
    networks:
      - antar-network

networks:
  antar-network:
    driver: bridge

volumes:
  redis-data: