spring.application.name=auth-service

server.port=8085

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

auth.jwt.secret=${JWT_SECRET}
auth.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:180}
auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:true}

service.accounts.video-service.password=${VIDEO_SERVICE_PASSWORD}
service.accounts.encoding-service.password=${ENCODING_SERVICE_PASSWORD}

spring.data.redis.host=redis
spring.data.redis.port=6379

auth.token.ttl-hours=${AUTH_TOKEN_TTL_HOURS:0}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management.endpoints.web.exposure.include=health, info

spring.grpc.server.port=4091