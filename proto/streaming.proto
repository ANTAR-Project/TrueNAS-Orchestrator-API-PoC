syntax = "proto3";

package com.tamojit.grpc.streaming;

option java_multiple_files = true;
option java_package = "com.tamojit.grpc.streaming";

service StreamingGrpcService {
  rpc GetRewrittenPlaylist (PlaylistRequest) returns (PlaylistResponse);
}

message PlaylistRequest {
  string path = 1;
  string token = 2;
}

message PlaylistResponse {
  string content = 1;
}